aid: scalapay
name: Scalapay
description: >-
  Scalapay is an Italian buy-now-pay-later (BNPL) payment provider that lets shoppers split a purchase
  into instalments — pay in 3, pay in 4, or pay later — while the merchant is settled by Scalapay. Its
  REST API is a compact, order-centric surface: create an instalment order, redirect the shopper to
  Scalapay Checkout, then capture, delay, void or refund against the order token, with a parallel
  in-store and offline pay-by-link family authenticated by a device-scoped key, plus reporting
  endpoints for reconciling orders, refunds, payouts and disputes against Scalapay's bank transfers.
  Merchants integrate through a CDN-loaded web component (the Scalapay Suite Widget) on the product,
  cart and checkout pages, or through prebuilt modules for Magento, WooCommerce, PrestaShop, Shopify,
  Shopware, BigCommerce, VTEX, Salesforce and others. Scalapay operates in EUR across 14 authorised
  European territories.
