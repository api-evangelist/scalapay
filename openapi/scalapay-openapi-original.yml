  /v2/payments/{token}/refund:
    post:
      tags:
      - Orders
      summary: Refund order
      description: Refund a fulfilled payment. The funds are reversed from the merchant's account and returned to the customer.
      parameters:
      - name: token
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: string
        description: Order token.
        example: 71KH916VPE
      - name: Idempotency-Key
        in: header
        description: Idempotency key used for retrying requests. Can be used for retrying failed requests.
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: 'Request body must be JSON (Content-Type: application/json). Responses are always JSON.'
        content:
          application/json:
            schema:
              type: object
              required:
              - refundAmount
              properties:
                refundAmount:
                  allOf:
                  - $ref: '#/components/schemas/amount'
                  description: Amount to refund.
                merchantRefundReference:
                  type: string
                  description: Merchant reference for the refund. Use this to track the refund in your system.
            example:
              refundAmount:
                amount: '190.00'
                currency: EUR
              merchantRefundReference: ABC123
      responses:
        '200':
          description: Refund processed successfully
          headers:
            Request-Idempotency:
              schema:
                type: string
                enum:
                - 'true'
              description: Present when the response was served from the idempotency cache.
              required: false
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
                    description: The order token.
                  amount:
                    type: object
                    description: The refund amount.
                    properties:
                      amount:
                        type: string
                        description: The amount value.
                      currency:
                        type: string
                        description: The currency code (ISO 4217).
                  merchantReference:
                    type: string
                    description: The merchant reference.
                  merchantRefundReference:
                    type: string
                    description: The merchant refund reference.
                  refundToken:
                    type: string
                    description: The refund token.
                  refundedAt:
                    type: string
                    description: The date and time when the refund was processed.
              example:
                token: 71KH916VPE
                amount:
                  amount: '190.00'
                  currency: EUR
                merchantReference: ABC123
                merchantRefundReference: ABC123
                refundToken: pre_transfer
                refundedAt: '2024-11-08T11:32:06.502Z'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '409':
          $ref: '#/components/responses/409Error'
  /v2/payments/{token}/void:
    post:
      tags:
      - Orders
      summary: Void order
      description: Void any authorizations for the order. The customer is informed of the cancellation and that the order
        could not be fulfilled; any held funds are released.
      parameters:
      - name: token
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: string
        description: Order token.
        example: 71KH916VPE
      - name: Idempotency-Key
        in: header
        description: Idempotency key used for retrying requests. Can be used for retrying failed requests.
        required: false
        schema:
          type: string
      requestBody:
        description: 'Request body must be JSON (Content-Type: application/json). Responses are always JSON.'
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantReference:
                  $ref: '#/components/schemas/merchantReference'
            example:
              merchantReference: RF127261AD22
      responses:
        '200':
          description: Order voided successfully
          headers:
            Request-Idempotency:
              schema:
                type: string
                enum:
                - 'true'
              description: Present when the response was served from the idempotency cache.
              required: false
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
                    description: The order token.
                  merchantReference:
                    type: string
                    description: The merchant reference.
                  voidedAt:
                    type: string
                    description: The date and time when the order was voided.
              example:
                token: B1KLLDPMIH
                merchantReference: RF127261AD22
                voidedAt: '2021-02-25T21:29:41.835Z'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '409':
          $ref: '#/components/responses/409Error'
