  /v2/orders:
    post:
      tags:
      - Orders
      summary: Create order
      description: Create a Scalapay order. The endpoint returns a `token` required to capture the payment and a `checkoutUrl`
        that redirects the customer to Scalapay Checkout, where the payment is authorized.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key used for retrying requests. Can be used for retrying failed requests.
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: 'Request body must be JSON (Content-Type: application/json). Responses are always JSON.'
        content:
          application/json:
            schema:
              type: object
              required:
              - consumer
              - items
              - merchant
              - shipping
              - totalAmount
              properties:
                totalAmount:
                  allOf:
                  - $ref: '#/components/schemas/amount'
                  description: Total amount of the order.
                consumer:
                  type: object
                  required:
                  - phoneNumber
                  - givenNames
                  - surname
                  - email
                  description: Consumer information.
                  properties:
                    phoneNumber:
                      type: string
                      description: Customer phone number with country code.
                    givenNames:
                      type: string
                      description: Consumer first name.
                    surname:
                      type: string
                      description: Consumer last name.
                    email:
                      type: string
                      description: Consumer email address.
                billing:
                  allOf:
                  - $ref: '#/components/schemas/address'
                  description: Customer billing address.
                shipping:
                  allOf:
                  - $ref: '#/components/schemas/address'
                  required:
                  - phoneNumber
                  - countryCode
                  - name
                  - postcode
                  - suburb
                  - line1
                  description: Customer shipping address.
                items:
                  allOf:
                  - $ref: '#/components/schemas/items'
                  description: Items purchased by the consumer.
                discounts:
                  type: array
                  description: Discounts applied to the order.
                  items:
                    type: object
                    properties:
                      amount:
                        $ref: '#/components/schemas/amount'
                      displayName:
                        type: string
                        description: Display name of the discount.
                merchant:
                  type: object
                  required:
                  - redirectCancelUrl
                  - redirectConfirmUrl
                  description: Redirection URLs for completing the payment.
                  properties:
                    redirectCancelUrl:
                      type: string
                      description: Use https://portal.integration.scalapay.com/failure-url for testing.
                    redirectConfirmUrl:
                      type: string
                      description: Use https://portal.integration.scalapay.com/success-url for testing.
                merchantReference:
                  $ref: '#/components/schemas/merchantReference'
                shippingAmount:
                  allOf:
                  - $ref: '#/components/schemas/amount'
                  description: Shipping amount.
                taxAmount:
                  allOf:
                  - $ref: '#/components/schemas/amount'
                  description: Tax amount.
                type:
                  type: string
                  enum:
                  - ''
                  - online
                  - offline
                  - link
                  example: online
                  description: Type of order. Use `online` for online orders, `offline` for offline orders, and `link` for
                    orders sent by SMS. When using `link`, include the extensions field.
                product:
                  type: string
                  enum:
                  - ''
                  - pay-in-3
                  - pay-in-4
                  - later
                  description: Product type. Could be empty. Use `pay-in-3` for pay in 3, `pay-in-4` for pay in 4, and `later`
                    for pay later.
                frequency:
                  type: object
                  description: Specify the frequency of the payment. This is useful for pay later products. Do not include
                    when using pay-in-3 or pay-in-4.
                  properties:
                    number:
                      type: integer
                      example: 1
                    frequencyType:
                      type: string
                      example: monthly
                orderExpiryMilliseconds:
                  type: integer
                  example: 2400000
                  description: Length of time (in milliseconds) that the order is valid. The maximum value is determined by
                    your Scalapay contract. To extend it, contact Scalapay support.
                extensions:
                  $ref: '#/components/schemas/extensions'
            examples:
              Order:
                $ref: '#/components/examples/CreateOrderExample'
              Pay by link:
                $ref: '#/components/examples/CreatePayByLinkExample'
      responses:
        '200':
          description: Successful order creation
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
                    description: The order token used to capture the payment.
                  expires:
                    type: string
                    description: Expiry timestamp of the order.
                  checkoutUrl:
                    type: string
                    description: URL that redirects the customer to Scalapay Checkout.
              example:
                token: 71KH916VPE
                expires: '2024-11-08T13:06:17.858Z'
                checkoutUrl: https://portal.scalapay.com/checkout/71KH916VPE
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '409':
          $ref: '#/components/responses/409Error'
  /v2/orders/{token}:
    post:
      tags:
      - Orders
      summary: Update order
      description: Update an order by changing the `merchantReference`. Use this endpoint when specifying the `merchantReference`
        during order creation was not possible.
      parameters:
      - name: token
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: string
        description: Order token.
      - name: Idempotency-Key
        in: header
        description: Idempotency key used for retrying requests. Can be used for retrying failed requests.
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: 'Request body must be JSON (Content-Type: application/json). Responses are always JSON.'
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantReference:
                  type: string
                  minLength: 1
                  description: Merchant reference for tracking the order in your system. Omit the field to remove the value.
                merchantProcessorReference:
                  type: string
                  minLength: 1
                  description: Merchant processor reference for tracking the order in your system.
            example:
              merchantReference: merchantOrder-1234
              merchantProcessorReference: processorOrder-1234
      responses:
        '200':
          description: Order updated successfully
          headers:
            Request-Idempotency:
              schema:
                type: string
                enum:
                - 'true'
              description: Present when the response was served from the idempotency cache.
              required: false
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
                    description: The order token that was updated.
                  merchantReference:
                    type: string
                    description: The updated merchant reference, returned if provided in the request.
                  merchantProcessorReference:
                    type: string
                    description: The updated merchant processor reference, returned if provided in the request.
              example:
                token: 71KH916VPE
                merchantReference: merchantOrder-1234
                merchantProcessorReference: processorOrder-1234
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '409':
          $ref: '#/components/responses/409Error'
  /v2/payments/capture:
    post:
      tags:
      - Orders
      summary: Capture order
      description: Capture the payment associated with the order. The specified amount is deducted from the user's account
        and transferred to the merchant's account. You can capture an amount up to the total specified during order creation.
        You may also provide an updated `merchantReference` to update the order.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key used for retrying requests. Can be used for retrying failed requests.
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: 'Request body must be JSON (Content-Type: application/json). Responses are always JSON.'
        content:
          application/json:
            schema:
              title: amount
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: Order token.
                merchantReference:
                  $ref: '#/components/schemas/merchantReference'
                amount:
                  allOf:
                  - $ref: '#/components/schemas/amount'
                  description: Amount to capture.
            example:
              token: 71KH916VPE
              merchantReference: merchantOrder-updated
              amount:
                amount: 190,00
                currency: EUR
      responses:
        '200':
          description: Payment captured successfully
          headers:
            Request-Idempotency:
              schema:
                type: string
                enum:
                - 'true'
              description: Present when the response was served from the idempotency cache.
              required: false
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - status
                properties:
                  token:
                    type: string
                    description: The order token.
                  status:
                    type: string
                    description: The status of the capture.
                  totalAmount:
                    type: object
                    description: The total amount captured.
                    properties:
                      amount:
                        type: string
                        description: The amount value.
                      currency:
                        type: string
                        description: The currency code (ISO 4217).
                  orderDetails:
                    type: object
                    description: The full order details.
                  capturedAt:
                    type: string
                    description: The date and time when the capture was processed.
              example:
                token: 71KH916VPE
                status: APPROVED
                totalAmount:
                  currency: EUR
                  amount: '190.00'
                orderDetails:
