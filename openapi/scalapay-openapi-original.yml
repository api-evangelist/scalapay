                    surname: Consumer
                    givenNames: Joe
                    phoneNumber: '0400000001'
                  merchant:
                    redirectCancelUrl: https://integration.api.scalapay.com/failure-url
                    redirectConfirmUrl: https://integration.api.scalapay.com/success-url
                  shipping:
