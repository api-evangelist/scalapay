  /v2/payments/{token}/delay:
    post:
      tags:
      - Orders
      summary: Delay order
      description: Request a delayed capture for the order. The payment schedule for the customer is created; however, no funds are settled until a capture call is made. Outstanding authorizations are automatically voided once the authorization expiry time is reached.
      parameters:
      - name: token
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: string
        description: Order token.
        example: 71KH916VPE
      - name: Idempotency-Key
        in: header
        description: Idempotency key used for retrying requests. Can be used for retrying failed requests.
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: 'Request body must be JSON (Content-Type: application/json). Responses are always JSON.'
        content:
          application/json:
            schema:
              type: object
              required:
              - authorizationExpiryMilliseconds
              properties:
                authorizationExpiryMilliseconds:
                  type: integer
                  default: 432000000
                  description: Length of time (in milliseconds) that the authorization is valid.
                merchantReference:
                  $ref: '#/components/schemas/merchantReference'
            example:
              authorizationExpiryMilliseconds: 432000000
              merchantReference: merchantOrder-1234
      responses:
        '200':
          description: Order delayed successfully
          headers:
            Request-Idempotency:
              schema:
                type: string
                enum:
                - 'true'
              description: Present when the response was served from the idempotency cache.
              required: false
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - status
                properties:
                  token:
                    type: string
                    description: The order token.
                  status:
                    type: string
                    description: The current status of the order after delay.
                  authorizationExpiryAt:
                    type: string
                    description: The date and time when the authorization expires.
                  totalAmount:
                    type: object
                    description: The total amount of the order.
                    properties:
                      amount:
                        type: string
                        description: The amount value.
                      currency:
                        type: string
                        description: The currency code (ISO 4217).
                  orderDetails:
                    type: object
                    description: The full order details.
              example:
                token: 71KH916VPE
                status: AUTHORIZED
                authorizationExpiryAt: '2024-12-25T23:02:13.000Z'
                totalAmount:
                  amount: 40,70
                  currency: EUR
                orderDetails:
                  items:
                  - sku: '12341234'
                    gtin: '123458791330'
                    name: T-Shirt
                    brand: TopChoice
                    price:
                      amount: '10.00'
                      currency: EUR
                    category: clothes
                    quantity: 1
                    subcategory:
                    - shirt
                    - long-sleeve
                  - sku: '12341235'
                    gtin: '123458722222'
                    name: Jeans
                    brand: TopChoice
                    price:
                      amount: '20.00'
                      currency: EUR
                    category: clothes
                    quantity: 1
                    subcategory:
                    - pants
                    - jeans
                  billing:
                    name: Mario Rossi
                    line1: Via Puglia, 23
                    suburb: Castelfranco Veneto
                    postcode: '31033'
                    countryCode: IT
                    phoneNumber: '393001234567'
                  consumer:
                    email: test@scalapay.com
                    surname: Consumer
                    givenNames: Joe
                    phoneNumber: '0400000001'
                  merchant:
                    redirectCancelUrl: https://portal.integration.com/failure-url
                    redirectConfirmUrl: https://portal.integration.scalapay.com/success-url
                  shipping:
                    name: Mario Rossi
                    line1: Via Puglia, 23
                    suburb: Castelfranco Veneto
                    geoCode:
                      place_id: VklBK0RFTExBK1JPU0ErMjMrLE1PTlRFTFVQTytGSU9SRU5USU5PLDUwMDU2LElU
                    postcode: '31033'
                    countryCode: IT
                    phoneNumber: '393001234567'
                  discounts:
                  - amount:
                      amount: '3.00'
                      currency: EUR
                    displayName: 10% Off
                  taxAmount:
                    amount: '3.70'
                    currency: EUR
                  totalAmount:
                    amount: '40.70'
                    currency: EUR
                  shippingAmount:
                    amount: '10.00'
                    currency: EUR
                  merchantReference: merchantOrder-1234
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '409':
          $ref: '#/components/responses/409Error'
  /v2/payments/{token}/refund:
    post:
      tags:
      - Orders
      summary: Refund order
      description: Refund a fulfilled payment. The funds are reversed from the merchant's account and returned to the customer.
      parameters:
      - name: token
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: string
        description: Order token.
        example: 71KH916VPE
      - name: Idempotency-Key
        in: header
        description: Idempotency key used for retrying requests. Can be used for retrying failed requests.
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: 'Request body must be JSON (Content-Type: application/json). Responses are always JSON.'
        content:
          application/json:
            schema:
              type: object
              required:
              - refundAmount
              properties:
                refundAmount:
                  allOf:
                  - $ref: '#/components/schemas/amount'
                  description: Amount to refund.
                merchantRefundReference:
                  type: string
                  description: Merchant reference for the refund. Use this to track the refund in your system.
            example:
              refundAmount:
                amount: '190.00'
                currency: EUR
              merchantRefundReference: ABC123
      responses:
        '200':
          description: Refund processed successfully
          headers:
            Request-Idempotency:
              schema:
                type: string
                enum:
                - 'true'
              description: Present when the response was served from the idempotency cache.
              required: false
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
                    description: The order token.
                  amount:
                    type: object
                    description: The refund amount.
                    properties:
                      amount:
                        type: string
                        description: The amount value.
                      currency:
                        type: string
                        description: The currency code (ISO 4217).
                  merchantReference:
                    type: string
                    description: The merchant reference.
                  merchantRefundReference:
                    type: string
                    description: The merchant refund reference.
                  refundToken:
                    type: string
                    description: The refund token.
                  refundedAt:
                    type: string
                    description: The date and time when the refund was processed.
              example:
                token: 71KH916VPE
                amount:
                  amount: '190.00'
                  currency: EUR
                merchantReference: ABC123
                merchantRefundReference: ABC123
                refundToken: pre_transfer
                refundedAt: '2024-11-08T11:32:06.502Z'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '409':
          $ref: '#/components/responses/409Error'
  /v2/payments/{token}/void:
    post:
      tags:
      - Orders
      summary: Void order
      description: Void any authorizations for the order. The customer is informed of the cancellation and that the order could not be fulfilled; any held funds are released.
      parameters:
      - name: token
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: string
        description: Order token.
        example: 71KH916VPE
      - name: Idempotency-Key
        in: header
        description: Idempotency key used for retrying requests. Can be used for retrying failed requests.
        required: false
        schema:
          type: string
      requestBody:
        description: 'Request body must be JSON (Content-Type: application/json). Responses are always JSON.'
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantReference:
                  $ref: '#/components/schemas/merchantReference'
            example:
              merchantReference: RF127261AD22
      responses:
        '200':
          description: Order voided successfully
          headers:
            Request-Idempotency:
              schema:
                type: string
                enum:
                - 'true'
              description: Present when the response was served from the idempotency cache.
              required: false
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
                    description: The order token.
                  merchantReference:
                    type: string
                    description: The merchant reference.
                  voidedAt:
                    type: string
                    description: The date and time when the order was voided.
              example:
                token: B1KLLDPMIH
                merchantReference: RF127261AD22
                voidedAt: '2021-02-25T21:29:41.835Z'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '409':
          $ref: '#/components/responses/409Error'
components:
  schemas:
    amount:
      type: object
      required:
      - amount
      - currency
      description: The monetary amount.
      properties:
        amount:
          type: string
          description: 'Monetary value. Example: 187.95.'
        currency:
          type: string
          description: Currency code.
    address:
      type: object
      description: Address information.
      properties:
        phoneNumber:
          type: string
          description: Customer phone number with country code.
        countryCode:
          type: string
          format: iso-alpha-2
          description: Two-letter country code (e.g., IT for Italy).
        name:
          type: string
          description: Name of the recipient.
        postcode:
          type: string
          description: Postal code.
        suburb:
          type: string
          description: Suburb or city.
        line1:
          type: string
          description: Primary address line.
    extensions:
      type: object
      description: Additional extension properties for the order.
      properties:
        industry:
          type: object
          description: Industry-specific extensions.
          properties:
            travel:
              type: object
              description: Travel-related extension information.
              properties:
                startDate:
                  type: string
                  format: date
                  example: '2024-01-01'
                  description: Travel start date.
                endDate:
                  type: string
                  format: date
                  example: '2024-10-01'
                  description: Travel end date.
        type:
          type: object
          description: Extensions for link orders.
          properties:
            link:
              type: object
              required:
              - notification
              description: Extensions for orders created via a link.
              properties:
                notification:
                  type: object
                  required:
                  - channels
                  description: Notification details for the order.
                  properties:
                    phoneCountryCode:
                      type: string
                      example: '+39'
                      description: Customer phone number country code. Required if SMS is selected as a notification channel.
                    phoneNumber:
                      type: string
                      example: '3470000000'
                      description: Customer phone number. Required if SMS is selected as a notification channel.
                    preferredLanguage:
                      type: string
                      example: italiano
                      description: Customer's preferred language.
                      default: ''
                      enum:
                      - ''
                      - english
                      - italiano
                      - francais
                      - deutsch
                      - espanol
                      - dutch
                      - suomi
                      - portuguese
                    emailAddress:
                      type: string
                      example: test@scalapay.com
                      description: Customer email address. Required if email is selected as a notification channel.
                    channels:
                      type: array
                      items:
                        type: string
                        enum:
                        - email
                        - sms
                      example:
                      - email
                      - sms
                      description: Notification channels to use. Choose "email" and/or "sms".
    items:
      type: array
      description: List of items in the order.
      items:
        type: object
        required:
        - category
        - name
        - price
        - quantity
        - sku
        properties:
          gtin:
            type: string
            description: Global Trade Item Number (UPC, EAN, JAN, ISBN, ITF-14).
          quantity:
            type: integer
            description: Quantity of the item.
          price:
            allOf:
            - $ref: '#/components/schemas/amount'
            description: Price of the item.
          name:
            type: string
            description: Name of the item.
          category:
            type: string
            description: Category of the item.
          subcategory:
            type: array
            description: Subcategories of the item.
            items:
              type: string
          sku:
            type: string
            description: Stock Keeping Unit (SKU) code.
          brand:
            type: string
            description: Brand name.
          pageUrl:
            type: string
            description: URL of the product page.
          imageUrl:
            type: string
            description: URL of the product image.
    merchantReference:
      type: string
      description: Merchant reference for tracking the order in your system.
  responses:
    422Error:
      description: Unprocessable entity
      content:
        application/json:
          example:
            errorCode: invalid_token
            errorId: error-19g6ll3ud3ndj
            message: Order null not found.
            httpStatusCode: 422
    401Error:
      description: Unauthorized
      content:
        application/json:
          example: Unauthorized
    409Error:
      description: Conflict
      content:
        application/json:
          example:
            errorCode: conflicting_operation_in_progress
            errorId: error-19g6iml8px18g
            message: You tried to perform an operation that conflicts with another operation. Try again later.
            httpStatusCode: 409
    400Error:
      description: Bad request
      content:
        application/json:
          example:
            errorCode: api_validationerror
            errorId: error-19g6ll3ucve9e
            message:
              status: 400
              statusText: Bad Request
              errors:
              - field:
                - totalAmount
                - amount
                location: body
                messages:
                - '"amount" is not allowed to be empty'
                types:
                - any.empty
            httpStatusCode: 400
  examples:
