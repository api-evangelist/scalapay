  - {from: Item, to: Amount, type: has_one, via: price}
  - {from: Payment, to: Order, type: belongs_to, via: token}
  - {from: Refund, to: Order, type: belongs_to, via: token}
  - {from: Payout, to: Order, type: has_many, via: 'GET /v1/reporting/payouts/{token}/orders'}
  - {from: Payout, to: Refund, type: has_many, via: 'GET /v1/reporting/payouts/{token}/refunds'}
  - {from: Order, to: Payout, type: has_one, via: payoutDetails.merchantPayoutToken}
  - {from: Payout, to: Amount, type: has_many, via: 'grossAmount, netAmount, totalFeeAmount, scalapayFeeAmount, scalapayFeeTaxAmount, otherFeeAmount, otherFeeTaxAmount'}
  - {from: Dispute, to: Order, type: belongs_to, via: order reference}
  - {from: InstoreOrder, to: Amount, type: has_one, via: totalAmount}
